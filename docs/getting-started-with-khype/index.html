<script id="kntq-social-patch">
(function(){
  var X="https://x.com/KNTQHYPE", TG="https://t.me/KNTQHYPE";
  function fix(){
    document.querySelectorAll('a').forEach(function(a){
      var label=(a.getAttribute('aria-label')||'')+(a.textContent||'');
      var href=a.getAttribute('href')||'';
      if(/discord/i.test(label)||/discord/i.test(href)){ a.remove(); return; }
      if(/Stake\s*HYPE/i.test(a.textContent||'')){
        a.textContent='Buy';
        a.setAttribute('href','#buy');
      }
      if(/Follow us on X|\bX\b/.test(label) && a.querySelector('svg')) a.setAttribute('href', X);
      if(/Telegram/i.test(label) && a.querySelector('svg')) a.setAttribute('href', TG);
    });
    // Ensure footer social row has X + TG only
    document.querySelectorAll('div.flex.items-center.gap-2').forEach(function(row){
      var links=[].slice.call(row.querySelectorAll('a'));
      if(!links.length) return;
      var hasX=links.some(function(a){return /x\.com\/KNTQHYPE/i.test(a.href)||/Follow us on X/i.test(a.getAttribute('aria-label')||'');});
      var hasTg=links.some(function(a){return /t\.me\//i.test(a.href)||/Telegram/i.test(a.getAttribute('aria-label')||'');});
      if(hasX || hasTg){
        links.forEach(function(a){
          var l=a.getAttribute('aria-label')||'';
          if(/discord/i.test(l)) a.remove();
        });
      }
    });
  }
  fix();
  new MutationObserver(fix).observe(document.documentElement,{childList:true,subtree:true,characterData:true});
})();
